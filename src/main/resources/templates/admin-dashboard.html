<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5">
      <div class="card p-4 bg-white rounded shadow text-center">
        <h2 class="mb-4">Painel Administrativo</h2>

        <div class="d-grid gap-3">
          <a th:href="@{/cadastrar-usuario}" class="btn btn-primary">Cadastrar Usuário</a>
          <a th:href="@{/cadastrar-participante}" class="btn btn-success">Cadastrar Participante</a>
          <a th:href="@{/editar-usuario}" class="btn btn-warning">Editar Usuários</a>
          <a th:href="@{/editar-participante}" class="btn btn-warning">Editar Participantes</a>
          <a th:href="@{/verificar-votos}" class="btn btn-info">Verificar Votos</a>
          <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger w-100">Sair</button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
