<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Votação de Participantes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="data:,">
</head>

<body class="bg-light d-flex justify-content-center align-items-center" style="min-height: 100vh;">

<div class="container" style="max-width: 700px;">
  <h1 class="text-center mb-5">Votação de Participantes</h1>

  <form th:action="@{/votar}" method="post">

    <div th:each="categoria : ${participantes.keySet()}">
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0" th:text="${categoria}">Categoria</h4>
        </div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex align-items-center" th:each="participante : ${participantes.get(categoria)}">
            <input class="form-check-input me-2" type="radio"
                   th:name="${categoria}" th:value="${participante.id}" required>
            <label class="form-check-label" th:for="${'participante-' + participante.id}" th:text="${participante.nome}">
              Nome do Participante
            </label>
          </li>
        </ul>
      </div>
    </div>

    <div class="text-center mt-4">
      <button type="submit" class="btn btn-success">Confirmar Voto</button>
    </div>
  </form>

  <div class="text-center mt-3">
    <a th:href="${role == 'ADMIN'} ? @{/admin-dashboard} : @{/user-dashboard}" class="btn btn-outline-secondary">Voltar</a>
  </div>
</div>

</body>
</html>
