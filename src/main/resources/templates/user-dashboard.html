<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Início - Estância Pedro Broll Sobrinho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
      <div class="home-card text-center p-4 bg-white rounded shadow">
        <h2 class="mb-5">Estância Pedro Broll Sobrinho</h2>
        <div class="d-flex flex-column align-items-center gap-3">

          <a th:if="${votacaoLiberada} and !${jaVotou}" th:href="@{/votar}" class="btn btn-outline-primary btn-lg w-100">Votar</a>

          <button th:if="${votacaoLiberada} and ${jaVotou}" class="btn btn-outline-secondary btn-lg w-100" disabled>Votar</button>
          <div th:if="${votacaoLiberada} and ${jaVotou}" class="alert alert-info w-100 text-center mt-2">
            Você já atingiu o limite de votos. Obrigado por participar!
          </div>

          <button th:if="${!votacaoLiberada}" class="btn btn-outline-secondary btn-lg w-100" disabled>Votar</button>
          <div th:if="${!votacaoLiberada}" class="alert alert-warning w-100 text-center mt-2">
            A votação não está liberada no momento.
          </div>

          <a th:href="@{/acompanhar}" class="btn btn-outline-primary btn-lg w-100">Acompanhar seus votos</a>
          <a th:href="@{/listar-participantes}" class="btn btn-outline-primary btn-lg w-100">Listar participantes</a>
          <a th:href="@{/logout}" class="btn btn-danger btn-lg w-100 mt-3">Sair</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
