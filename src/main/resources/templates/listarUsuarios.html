<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Usuários</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="data:,">
</head>

<body class="bg-light d-flex justify-content-center align-items-center" style="min-height: 100vh;">

<div class="container" style="max-width: 700px;">
  <h1 class="text-center mb-5">Mesas</h1>

  <div class="card shadow-sm">
    <div class="card-header bg-success text-white">
      <h4 class="mb-0">Mesas Cadastradas</h4>
    </div>
    <ul class="list-group list-group-flush">
      <li class="list-group-item" th:each="usuario : ${usuarios}">
        <div><strong>Mesa:</strong> <span th:text="${usuario.mesa}">Número da Mesa</span></div>
        <div><strong>CPF:</strong> <span th:text="${usuario.cpf}">CPF do Usuário</span></div>
      </li>
    </ul>
  </div>

  <div class="text-center mt-4">
    <a th:href="@{/admin-dashboard}" class="btn btn-outline-secondary">Voltar</a>
  </div>
</div>

</body>
</html>
