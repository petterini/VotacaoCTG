<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Resultado Final</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="data:,">
</head>
<body class="bg-light p-5 d-flex justify-content-center">
<div class="container" style="max-width: 700px;">
  <h1 class="text-center mb-4">Resultado Final da Votação</h1>

  <div th:each="entry : ${contagemGeral}">
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-success text-white">
        <h4 class="mb-0" th:text="${entry.key}">Categoria</h4>
      </div>
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex justify-content-between"
            th:each="voteCount : ${entry.value}">
          <span th:text="${voteCount.key.nome}">Nome Participante</span>
          <span>
              <span th:text="${voteCount.value}">0</span> voto(s)
            </span>
        </li>
      </ul>
    </div>
  </div>

  <div class="text-center">
    <a th:href="@{/admin-dashboard}" class="btn btn-outline-secondary">Voltar</a><br><br>

    <form th:action="@{/excluir-todos-votos}" method="post"
          onsubmit="return confirm('Tem certeza que deseja excluir TODOS os votos? Esta ação não poderá ser desfeita.');">
      <button type="submit" class="btn btn-danger">Excluir Todos os Votos</button>
    </form>
  </div>
</div>
</body>
</html>
