<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Excluir Participante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

<div class="card p-4 shadow-sm" style="width: 100%; max-width: 500px;">
    <h2 class="text-center mb-4">Excluir Participante</h2>

    <!-- Mensagens -->
    <div th:if="${mensagem}" class="alert alert-success" role="alert">
        <span th:text="${mensagem}"></span>
    </div>
    <div th:if="${erro}" class="alert alert-danger" role="alert">
        <span th:text="${erro}"></span>
    </div>

    <!-- Formulário -->
    <form th:action="@{/excluirParticipante}" method="post">
        <!-- ComboBox para selecionar o participante -->
        <div class="mb-3">
            <label for="participante" class="form-label">Selecione o Participante para Exclusão:</label>
            <select id="participante" name="id" class="form-select" required onchange="preencherCampos()">
                <option value="">Selecione um participante</option>
                <option th:each="p : ${participantes}"
                        th:value="${p.id}"
                        th:data-nome="${p.nome}"
                        th:data-categoria="${p.categoria}"
                        th:text="${p.nome}">
                </option>
            </select>
        </div>

        <!-- Campos preenchidos mas desabilitados -->
        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" name="nome" class="form-control" required disabled>
        </div>

        <div class="mb-4">
            <label for="categoria" class="form-label">Categoria:</label>
            <select id="categoria" name="categoria" class="form-select" required disabled>
                <option value="Peão">Peão</option>
                <option value="Guri">Guri</option>
                <option value="Piá">Piá</option>
                <option value="Piazito">Piazito</option>
                <option value="Adulta">Adulta</option>
                <option value="Juvenil">Juvenil</option>
                <option value="Mirim">Mirim</option>
                <option value="Dente de Leite">Dente de Leite</option>
                <option value="Chinoquinha">Chinoquinha</option>
            </select>
        </div>

        <!-- Botão para excluir -->
        <div class="d-grid mb-2">
            <button type="submit" class="btn btn-danger">Excluir Participante</button>
        </div>
    </form>

    <div class="d-grid">
        <a th:href="@{/admin-dashboard}" class="btn btn-outline-secondary">Voltar</a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script para preencher os campos automaticamente -->
<script>
    function preencherCampos() {
        const select = document.getElementById("participante");
        const selectedOption = select.options[select.selectedIndex];

        const nome = selectedOption.getAttribute("data-nome");
        const categoria = selectedOption.getAttribute("data-categoria");

        document.getElementById("nome").value = nome || "";
        document.getElementById("categoria").value = categoria || "";
    }
</script>

</body>
</html>
