<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Participantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center" style="min-height: 100vh;">

<div class="container" style="max-width: 700px;">
    <h1 class="text-center mb-5">Participantes</h1>

    <div th:each="categoria : ${participantes.keySet()}">
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0" th:text="${categoria}">Categoria</h4>
            </div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item" th:each="participante : ${participantes.get(categoria)}">
                    <strong th:text="${participante.nome}">Nome do Participante</strong>
                </li>
            </ul>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/admin-dashboard}" class="btn btn-outline-secondary">Voltar</a>
    </div>
</div>

</body>
</html>
