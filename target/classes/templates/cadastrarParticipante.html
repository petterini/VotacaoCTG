<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Prendas e Peões</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

<div class="card p-4 shadow-sm" style="width: 100%; max-width: 500px;">
    <h2 class="text-center mb-4">Cadastro de Prendas e Peões</h2>

    <!-- Exibir mensagem de sucesso -->
    <div th:if="${mensagem}" class="alert alert-success" role="alert">
        <span th:text="${mensagem}"></span>
    </div>

    <!-- Exibir mensagem de erro -->
    <div th:if="${erro}" class="alert alert-danger" role="alert">
        <span th:text="${erro}"></span>
    </div>

    <form th:action="@{/cadastrarParticipante}" method="post">

        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" name="nome" class="form-control" required>
        </div>

        <div class="mb-4">
            <label for="categoria" class="form-label">Categoria:</label>
            <select id="categoria" name="categoria" class="form-select" required>
                <option value="">Selecione uma categoria</option>
                <option value="Peão">Peão</option>
                <option value="Guri">Guri</option>
                <option value="Piá">Piá</option>
                <option value="Piazito">Piazito</option>
                <option value="Adulta">Adulta</option>
                <option value="Juvenil">Juvenil</option>
                <option value="Mirim">Mirim</option>
                <option value="Pré-Mirim">Pré-Mirim</option>
                <option value="Dente de Leite">Dente de Leite</option>
                <option value="Chinoquinha">Chinoquinha</option>
            </select>
        </div>

        <div class="d-grid mb-2">
            <button type="submit" class="btn btn-success">Cadastrar</button>
        </div>

    </form>

    <div class="d-grid">
        <a th:href="@{/admin-dashboard}" class="btn btn-outline-secondary">Voltar</a>
    </div>
</div>

<!-- Bootstrap JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
