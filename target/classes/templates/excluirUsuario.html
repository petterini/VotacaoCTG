<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Excluir Mesa - Estância Pedro Broll Sobrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="register-card text-center p-4 bg-white rounded shadow">
                <h2 class="mb-4">Excluir Mesa</h2>

                <div th:if="${mensagem}" class="alert alert-success" role="alert">
                    <span th:text="${mensagem}"></span>
                </div>

                <!-- Exibir mensagem de erro -->
                <div th:if="${erro}" class="alert alert-danger" role="alert">
                    <span th:text="${erro}"></span>
                </div>

                <form method="POST" th:action="@{/excluirUsuario}">
                    <div class="mb-3 text-start">
                        <label for="mesa" class="form-label">Número da Mesa</label>
                        <input type="number" class="form-control" id="mesa" name="numMesa"
                               placeholder="Digite o número da mesa" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Excluir Mesa</button>
                </form>

                <a th:href="@{/admin-dashboard}" class="btn btn-outline-secondary w-100 mt-3">Voltar</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
