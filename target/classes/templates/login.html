<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
      <div class="login-card text-center p-4 bg-white rounded shadow">
        <h2 class="mb-4">Estância Pedro Broll Sobrinho</h2>
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
          Número da mesa ou senha incorretos.
        </div>
        <form method="POST" th:action="@{/login}">
          <div class="mb-3 text-start">
            <label for="username" class="form-label">Número da mesa</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Digite o número da mesa" required>
          </div>
          <div class="mb-4 text-start">
            <label for="password" class="form-label">Senha</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
