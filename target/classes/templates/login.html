<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="login-card text-center">
  <h2 class="mb-4">Estância Pedro Broll Sobrinho</h2>
  <form method="POST" th:action="@{/login}">
    <div class="mb-3 text-start">
      <label for="username" class="form-label">Número da mesa</label>
      <input type="text" class="form-control" id="username" name="username" placeholder="Digite o número da mesa" required>
    </div>
    <div class="mb-4 text-start">
      <label for="password" class="form-label">Senha</label>
      <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Entrar</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
