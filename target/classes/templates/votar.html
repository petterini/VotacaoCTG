<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Votar - Estância Pedro Broll Sobrinho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
  <div class="w-100" style="max-width: 900px;">
    <div class="text-center mb-4">
      <h2 class="fw-bold">Votação - Estância Pedro Broll Sobrinho</h2>
      <p class="text-muted">Escolha um candidato por categoria</p>
    </div>

    <form method="POST" th:action="@{/votar}" class="bg-white p-4 rounded shadow">

      <!-- Categorias Femininas -->
      <h4 class="mb-4">Categorias Femininas</h4>
      <div th:each="categoria : ${T(com.pedropetterini.votacaoctg.enums.Categoria).values()}">
        <div class="mb-3" th:if="${#lists.contains(prendas.?[categoria == categoria], true)}">
          <label class="fw-bold" th:text="'Categoria ' + ${categoria.name().replace('_', '-')}"></label>
          <div class="ms-3" th:each="c : ${prendas}">
            <div class="form-check" th:if="${c.categoria == categoria}">
              <input class="form-check-input" type="radio" th:name="${'categoria_' + categoria}" th:value="${c.id}" th:id="${'prenda-' + c.id}">
              <label class="form-check-label" th:for="${'prenda-' + c.id}" th:text="${c.nome}"></label>
            </div>
          </div>
        </div>
      </div>

      <!-- Categorias Masculinas -->
      <h4 class="mt-5 mb-4">Categorias Masculinas</h4>
      <div th:each="categoria : ${T(com.pedropetterini.votacaoctg.enums.Categoria).values()}">
        <div class="mb-3" th:if="${#lists.contains(peoes.?[categoria == categoria], true)}">
          <label class="fw-bold" th:text="'Categoria ' + ${categoria.name().replace('_', '-')}"></label>
          <div class="ms-3" th:each="c : ${peoes}">
            <div class="form-check" th:if="${c.categoria == categoria}">
              <input class="form-check-input" type="radio" th:name="${'categoria_' + categoria}" th:value="${c.id}" th:id="${'peao-' + c.id}">
              <label class="form-check-label" th:for="${'peao-' + c.id}" th:text="${c.nome}"></label>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success">Confirmar Voto</button>
        <a th:href="@{/home}" class="btn btn-secondary ms-2">Voltar</a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
