<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Usuário - Estância Pedro Broll Sobrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="register-card text-center p-4 bg-white rounded shadow">
                <h2 class="mb-4">Cadastrar Usuário</h2>

                <div th:if="${mensagem}" class="alert alert-success" role="alert">
                    <span th:text="${mensagem}"></span>
                </div>

                <!-- Exibir mensagem de erro -->
                <div th:if="${erro}" class="alert alert-danger" role="alert">
                    <span th:text="${erro}"></span>
                </div>

                <form method="POST" th:action="@{/cadastrarUsuario}">
                    <div class="mb-3 text-start">
                        <label for="mesa" class="form-label">Número da Mesa</label>
                        <input type="text" class="form-control" id="mesa" name="mesa"
                               placeholder="Digite o número da mesa" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" class="form-control" id="cpf" name="cpf" placeholder="Digite o CPF" required>
                    </div>

                    <div class="mb-4 text-start">
                        <label class="form-label d-block mb-2">Tipo de Usuário:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="roles" id="roleUser" value="USER"
                                   required checked>
                            <label class="form-check-label" for="roleUser">Usuário</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="roles" id="roleAdmin" value="ADMIN"
                                   required>
                            <label class="form-check-label" for="roleAdmin">Administrador</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Cadastrar</button>
                </form>

                <a th:href="@{/admin-dashboard}" class="btn btn-outline-secondary w-100 mt-3">Voltar</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
